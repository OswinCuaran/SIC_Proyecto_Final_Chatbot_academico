<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Académico - UNAL Manizales</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="contenedor-principal">
        
        <!-- Header -->
        <header class="header">
            <div class="header-contenido">
                <div class="logo-area">
                    <div class="logo-icono">🎓</div>
                    <div class="logo-texto">
                        <h1>Asistente Académico</h1>
                        <p>Administración de Sistemas Informáticos - UNAL Manizales</p>
                    </div>
                </div>
                <div class="estado-badge" id="estadoBadge">
                    <span class="estado-punto"></span>
                    <span id="estadoTexto">Conectando...</span>
                </div>
            </div>
        </header>

        <!-- Área del chat -->
        <main class="chat-contenedor">
            
            <!-- Mensajes -->
            <div class="mensajes-area" id="mensajesArea">
                <div class="mensaje-bienvenida">
                    <div class="bienvenida-icono">👋</div>
                    <h2>¡Hola! Soy tu asistente académico</h2>
                    <p>Puedo ayudarte con información sobre:</p>
                    <div class="sugerencias-grid">
                        <button class="sugerencia-btn" onclick="enviarSugerencia(this)">
                            📚 ¿Qué materias hay en el semestre 3?
                        </button>
                        <button class="sugerencia-btn" onclick="enviarSugerencia(this)">
                            🔑 ¿Cuáles son los prerrequisitos de Bases de Datos I?
                        </button>
                        <button class="sugerencia-btn" onclick="enviarSugerencia(this)">
                            📖 ¿De qué trata Sistemas Inteligentes Computacionales?
                        </button>
                        <button class="sugerencia-btn" onclick="enviarSugerencia(this)">
                            🎯 ¿Cuántos créditos tiene Ingeniería de Software I?
                        </button>
                    </div>
                </div>
            </div>

            <!-- Input area -->
            <div class="input-area">
                <div class="input-contenedor">
                    <textarea 
                        id="inputPregunta" 
                        placeholder="Escribe tu pregunta sobre el programa académico..."
                        rows="1"
                        onkeydown="manejarTecla(event)"
                        oninput="ajustarAltura(this)"
                    ></textarea>
                    <button class="btn-enviar" id="btnEnviar" onclick="enviarPregunta()">
                        <span id="iconoEnviar">➤</span>
                    </button>
                </div>
                <p class="input-nota">Presiona Enter para enviar · Shift+Enter para nueva línea</p>
            </div>

        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
